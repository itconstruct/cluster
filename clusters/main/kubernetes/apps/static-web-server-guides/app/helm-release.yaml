apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: guides
  namespace: guides
spec:
  interval: 15m
  chart:
    spec:
      chart: static-web-server
      version: 8.12.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    persistence:
      config:
        enabled: false
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: guides.${DOMAIN_0}
    image:
      repository: ghcr.io/itconstruct/guides
      tag: 1.0.0@sha256:sha256:5ff018dd272e3cbbf6eb9ae5b13e2e8a14c05286aecf9d9883182eed95299d99
    imagePullSecret:
      ghcr:
        enabled: true
        data:
          registry: ghcr.io
          username: "${GHCR_USER}"
          password: "${GHCR_PAT}"
        targetSelectAll: true
