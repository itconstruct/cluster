---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wire-pod
  namespace: wire-pod
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    credentials:
      s3:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-wire-pod"
        accessKey: "${S3ID}"
        secretKey: "${S3KEY}"
        encrKey: "${S3KEY}"
    image:
      repository: ghcr.io/kercre123/wire-pod
      pullPolicy: IfNotPresent
      # Upstream publishes no current semver image tags - pin main by digest,
      # Renovate raises a PR when the digest changes.
      tag: main@sha256:c3c52a0f27227caf407db4e24f199a1c35284ebde6b21d1e56d8e2f75e456b9a
    securityContext:
      container:
        # start.sh refuses to run as non-root; entrypoint rewrites /opt/wire-pod
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        readOnlyRootFilesystem: false
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: "${WIREPOD_IP}"
        integrations:
          metallb:
            enabled: true
        ports:
          main:
            port: 8080 # web UI
            targetPort: 8080
          conncheck:
            enabled: true
            port: 80 # robot polls escapepod.local/ok
            targetPort: 80
            protocol: tcp
          chipper:
            enabled: true
            port: 443 # voice, jdocs, token - raw TLS, never terminate
            targetPort: 443
            protocol: tcp
          escapepod:
            enabled: true
            port: 8084 # port advertised in the escapepod mDNS record
            targetPort: 8084
            protocol: tcp
    ingress:
      main:
        enabled: true
        ingressClassName: internal # web UI has no auth - keep it internal only
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: wirepod.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      data:
        enabled: true
        mountPath: /data
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true
              cacheCapacity: 1Gi
            src:
              enabled: true
              cacheCapacity: 1Gi
              trigger:
                schedule: "20 15 * * *" # 02:20 AEDT / 01:20 AEST
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                WIREPOD_DATA_DIR: "{{ .Values.persistence.data.mountPath }}"
                WIREPOD_USE_INBUILT_BLE: "false" # no Bluetooth in the VM
                # wire-pod would advertise escapepod.local with the POD IP.
                # escapepod.local -> ${WIREPOD_IP} is published on the LAN instead.
                DISABLE_MDNS: "true"
              probes:
                liveness:
                  enabled: true
                  type: http
                  path: /ok
                  port: "{{ .Values.service.main.ports.main.port }}"
                readiness:
                  enabled: true
                  type: http
                  path: /ok
                  port: "{{ .Values.service.main.ports.main.port }}"
                startup:
                  enabled: true
                  type: tcp
                  port: "{{ .Values.service.main.ports.main.port }}"
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi # Vosk model loads into memory
